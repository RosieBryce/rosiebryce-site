<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosie Bryce</title>
<meta name="description" content="Rosie Bryce — AI, insight, analytics. Manchester.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%234E0D66'/%3E%3Cg fill='%23FF979B'%3E%3Crect x='26' y='26' width='20' height='20' rx='3'/%3E%3Crect x='54' y='26' width='20' height='20' rx='3'/%3E%3Crect x='26' y='54' width='20' height='20' rx='3'/%3E%3Crect x='54' y='54' width='20' height='20' rx='3'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* FONTS */
:root {
  --font-display: "Young Serif", Georgia, "Iowan Old Style", serif;
  --font-body:    "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --track-body: 0.01em;
  --track-display: 0.015em;
  --track-caps: 0.11em;
  --size-200: 0.8125rem;
  --size-400: 1.0625rem;
  --size-1000: clamp(3.4rem, 2.35rem + 5.1vw, 6.4rem);
  --ground: #FFF3F6;
  --rule-strong: #FCCCD7;
  --ink: #25000C;
  --ink-soft: #654E53;
  --ink-faint: #765B61;
  --signal: #ED254E;
  --signal-text: #BC0037;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--size-400);
  line-height: 1.65;
  letter-spacing: var(--track-body);
}
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 48px 24px;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
}
.mark { width: 44px; height: 44px; color: var(--signal); margin-bottom: 28px; }
.mark svg { display: block; width: 100%; height: 100%; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--size-1000);
  line-height: 1.02;
  letter-spacing: var(--track-display);
  margin: 0 0 20px;
}
.tagline {
  font-family: var(--font-mono);
  font-size: var(--size-200);
  text-transform: uppercase;
  letter-spacing: var(--track-caps);
  color: var(--signal-text);
  margin: 0 0 40px;
}
.tagline .sep { color: var(--ink-faint); padding: 0 .35em; }
.contact { margin: 0; color: var(--ink-soft); }
.contact a {
  color: var(--ink);
  font-weight: 600;
  text-decoration: none;
  border-bottom: 2px solid var(--signal);
  overflow-wrap: anywhere;
}
.contact a:hover, .contact a:focus-visible { color: var(--signal-text); }
footer {
  padding: 20px 24px;
  border-top: 1px solid var(--rule-strong);
  font-family: var(--font-mono);
  font-size: var(--size-200);
  color: var(--ink-faint);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 100 100"><g fill="currentColor">
      <rect x="24" y="24" width="22" height="22" rx="3"/><rect x="54" y="24" width="22" height="22" rx="3"/>
      <rect x="24" y="54" width="22" height="22" rx="3"/><rect x="54" y="54" width="22" height="22" rx="3"/>
    </g></svg>
  </div>
  <h1>Rosie Bryce</h1>
  <p class="tagline">AI<span class="sep">&middot;</span>Insight<span class="sep">&middot;</span>Analytics</p>
  <p class="contact">Get in touch: <a href="mailto:rosie@rosiebryce.co.uk">rosie@rosiebryce.co.uk</a></p>
</main>
<footer><span>Manchester</span><span>rosiebryce.co.uk</span></footer>
</body>
</html>
